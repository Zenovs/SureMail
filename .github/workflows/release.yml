name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            squashfs-tools \
            fakeroot \
            rpm \
            dpkg

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Build React
        run: npm run react-build
        env:
          CI: false

      - name: Build Electron AppImage (x64 + arm64)
        run: ./node_modules/.bin/electron-builder --linux appimage --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        run: ls -la dist/

      # Security v6.2.0: SHA-256-Manifest erzeugen für In-App-Update-Verifikation.
      # Die App lädt SHA256SUMS.txt zusätzlich zur AppImage und prüft den Hash
      # gegen den im Manifest hinterlegten Wert. Stimmt er nicht, wird das Update verworfen.
      - name: Generate SHA256SUMS manifest
        working-directory: dist
        run: |
          sha256sum *.AppImage > SHA256SUMS.txt
          echo "Generated manifest:"
          cat SHA256SUMS.txt

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CoreMail Desktop v${{ steps.version.outputs.VERSION }}
          body: |
            ## CoreMail Desktop v${{ steps.version.outputs.VERSION }}

            ### Installation / Update

            Das Script erkennt die Architektur automatisch (x64 / arm64):

            ```bash
            bash <(curl -s https://raw.githubusercontent.com/Zenovs/coremail/initial-code/install.sh)
            ```

            ### Downloads

            | Architektur | Datei |
            |---|---|
            | x64 (Standard-PC) | `CoreMail-Desktop-${{ steps.version.outputs.VERSION }}-x64.AppImage` |
            | arm64 (Raspberry Pi 4/5) | `CoreMail-Desktop-${{ steps.version.outputs.VERSION }}-arm64.AppImage` |

            ### Verifikation
            Die `SHA256SUMS.txt` enthält die SHA-256-Hashes aller AppImages. Manuelle Prüfung:
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
            Ab v6.2.0 prüft die In-App-Update-Funktion diesen Hash automatisch.

            ### Änderungen
            Siehe [Commit-History](https://github.com/Zenovs/coremail/commits/initial-code)
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
